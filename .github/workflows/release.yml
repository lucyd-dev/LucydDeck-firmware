name: Build and Release Firmware

on:
  push:
    tags:
    - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
        key: ${{ runner.os }}-pio
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install PlatformIO Core
      run: pip install --upgrade platformio

    - name: Build firmware (release env)
      run: platformio run -e release
    - name: Upload firmware.bin
      uses: actions/upload-artifact@v6
      with:
        name: firmware-${{ github.ref_name }}
        path: 
          .pio/build/release/firmware.bin
  release:
      runs-on: ubuntu-latest
      needs: build
      permissions:
          contents: write
      steps:
      - name: Get firmware.bin
        uses: actions/download-artifact@v7
        with:
          name: firmware-${{ github.ref_name }}
      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: LucydDeck Firmware ${{ github.ref_name }}
          files: firmware.bin
