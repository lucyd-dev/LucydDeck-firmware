name: CI - Build Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Release-please opens its PR with GITHUB_TOKEN, so no pull_request event
  # fires for it and the required check never runs. Dispatch this workflow on
  # the release branch to give the ruleset a real run; never merge with --admin.
  workflow_dispatch:

jobs:
  build-check:
    name: PlatformIO Compile Test
    # A release-please commit is built and published by the release workflow,
    # so building it again here only duplicates that work.
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache PlatformIO Core & Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Check the release manifest script
        run: python3 -m py_compile scripts/firmware_manifest.py

      - name: Test Compilation
        run: pio run
