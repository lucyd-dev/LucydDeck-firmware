name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout repository
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: pip install --upgrade platformio

      - name: Build Firmware
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: pio run -e release

      - name: Upload Firmware to Release
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.release.outputs.tag_name || steps.release.outputs['--tag_name'] }}"
          
          if [ -z "$TAG_NAME" ]; then
            echo "Error: Got no tagname from Release Please."
            exit 1
          fi

          BIN_PATH=$(find .pio/build -name "firmware.bin" | head -n 1)
          
          if [ -z "$BIN_PATH" ]; then
            echo "Error: firmware.bin not found."
            exit 1
          fi

          OUTPUT_NAME="LucydDeck-firmware-${TAG_NAME}.bin"
          cp "$BIN_PATH" "$OUTPUT_NAME"
          
          gh release upload "$TAG_NAME" "$OUTPUT_NAME" --clobber
